# alembic.ini — Alembic configuration file
# This is what Alembic reads when you run `alembic upgrade head`

[alembic]
# script_location = where your alembic folder is
script_location = alembic

# file_template = naming convention for generated migration files
# %(year)d%(month).2d%(day).2d_%(hour).2d%(minute).2d — date-based prefix
# %(rev)s — short revision hash
# %(slug)s — slugified description
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone = timestamps in migration files use UTC
timezone = UTC

# truncate_slug_length = max length for the slug part of filename
truncate_slug_length = 40

# The database URL is set dynamically in env.py (reads from .env)
# We intentionally leave this blank here — env.py handles it
sqlalchemy.url =

[post_write_hooks]
# Optionally run black/ruff on generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
