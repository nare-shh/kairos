[pytest]
# asyncio_mode = auto: every async test function runs without needing @pytest.mark.asyncio
asyncio_mode = auto
# Each test (and its async fixtures) gets its own event loop
asyncio_default_fixture_loop_scope = function

# testpaths: where pytest looks for tests
testpaths = tests

# addopts: flags always passed to pytest
# -v = verbose (show each test name)
# -s = don't capture stdout (see print() in tests)
# --tb=short = shorter traceback on failure
addopts = -v -s --tb=short
